name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ordl-osrs
        uses: actions/checkout@v4

      - name: Checkout ordl-game
        uses: actions/checkout@v4
        with:
          repository: ordl-winsock/ordl-game
          path: ordl-game
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang mesa-common-dev libegl1-mesa-dev

      - name: Build ordl-game (FORGE library only)
        run: |
          cd ordl-game
          make NO_LTO=1 -j$(nproc) build/libforge.a

      - name: Build ordl-osrs
        run: |
          make NO_LTO=1 FORGE_DIR="$PWD/ordl-game" -j$(nproc) all

      - name: Run unit tests
        run: |
          ./build/test_crypto
          ./build/test_playerinfo
